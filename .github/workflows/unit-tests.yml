name: Unit Tests

on:
  pull_request:
    branches:
      - main
      - 'version-*'
      - 'version/*'

env:
  GO_VERSION: '1.26.4'

jobs:
  # ===========================================================================
  # UNIT TESTS - Run Go unit tests with coverage
  # ===========================================================================
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with coverage
        id: tests
        run: |
          if go test -v -race \
            ./cmd/listener/core/... \
            ./cmd/flagger/core/... \
            -coverprofile=coverage.out \
            -covermode=atomic 2>&1 | tee test-output.txt; then
            echo "tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "tests_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate coverage report
        id: coverage
        if: always()
        run: |
          if [ -f coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
            echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "report<<EOF" >> $GITHUB_OUTPUT
            go tool cover -func=coverage.out >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "percentage=N/A" >> $GITHUB_OUTPUT
            echo "report=No coverage data available" >> $GITHUB_OUTPUT
          fi

      - name: Post test results to PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: unit-tests
          message: |
            ## 🧪 Unit Tests

            ${{ steps.tests.outputs.tests_passed == 'true' && '✅ **All tests passed**' || '❌ **Some tests failed**' }}

            ### 📊 Code Coverage: `${{ steps.coverage.outputs.percentage }}`

            <details>
            <summary>View coverage by function</summary>

            ```
            ${{ steps.coverage.outputs.report }}
            ```

            </details>

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

      - name: Fail if tests failed
        if: steps.tests.outputs.tests_passed == 'false'
        run: exit 1
