name: Unit Tests

on:
  pull_request:
    branches:
      - main
      - 'version-*'
      - 'version/*'

env:
  GO_VERSION: '1.26.4'

jobs:
  # ===========================================================================
  # UNIT TESTS - Run Go unit tests with coverage
  # ===========================================================================
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with coverage
        id: tests
        run: |
          if go test -v -race \
            ./cmd/listener/core/... \
            ./cmd/flagger/core/... \
            -coverprofile=coverage.out \
            -covermode=atomic 2>&1 | tee test-output.txt; then
            echo "tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "tests_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate coverage report
        id: coverage
        if: always()
        run: |
          if [ -f coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
            echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "report<<EOF" >> $GITHUB_OUTPUT
            go tool cover -func=coverage.out >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "percentage=N/A" >> $GITHUB_OUTPUT
            echo "report=No coverage data available" >> $GITHUB_OUTPUT
          fi

      - name: Post test results to PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: unit-tests
          message: |
            ## 🧪 Unit Tests

            ${{ steps.tests.outputs.tests_passed == 'true' && '✅ **All tests passed**' || '❌ **Some tests failed**' }}

            ### 📊 Code Coverage: `${{ steps.coverage.outputs.percentage }}`

            <details>
            <summary>View coverage by function</summary>

            ```
            ${{ steps.coverage.outputs.report }}
            ```

            </details>

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

      - name: Fail if tests failed
        if: steps.tests.outputs.tests_passed == 'false'
        run: exit 1

  # ===========================================================================
  # SONARCLOUD - Code quality and security analysis
  # ===========================================================================
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-22.04
    needs: unit-tests
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-report
        continue-on-error: true

      - name: Ensure SonarCloud project exists
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        run: |
          PROJECT_KEY="Parfin_${{ github.event.repository.name }}"
          ORGANIZATION="parfin"
          REPO_NAME="${{ github.event.repository.name }}"

          echo "Checking project: $PROJECT_KEY"

          # Get project
          RESPONSE=$(curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/projects/search?projects=$PROJECT_KEY&organization=$ORGANIZATION")

          # Check if project exists
          if echo "$RESPONSE" | grep -q '"total":0'; then
            echo "Project does not exist. Creating..."

            CREATE_RESPONSE=$(curl -s -X POST -u "$SONAR_TOKEN:" \
              "https://sonarcloud.io/api/projects/create" \
              -d "organization=$ORGANIZATION" \
              -d "project=$PROJECT_KEY" \
              -d "name=$REPO_NAME" \
              -d "visibility=private" \
              -d "newCodeDefinitionType=previous_version" \
              -d "newCodeDefinitionValue=previous_version")

            # Verify if creation was done
            if echo "$CREATE_RESPONSE" | grep -q '"key"'; then
              echo "Project created successfully"
            else
              echo "Failed to create project:"
              echo "$CREATE_RESPONSE"
            fi
          else
            echo "Project already exists"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Parfin_${{ github.event.repository.name }}
            -Dsonar.organization=parfin
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.exclusions=**/mocks/**,**/contracts/**,**/*_test.go,**/migrations/**,**/.devops/**,**/build/**,**/vendor/**
            -Dsonar.qualitygate.wait=false

      - name: Post SonarCloud link to PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: sonarcloud
          message: |
            ## 📈 SonarCloud Analysis

            View detailed code quality and security analysis on [SonarCloud](https://sonarcloud.io/project/overview?id=Parfin_${{ github.event.repository.name }})
