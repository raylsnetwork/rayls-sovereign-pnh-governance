          fi

      - name: Post Trivy results to PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: trivy-flagger
          message: |
            ## 🔒 Security Scan - Flagger

            **Image:** `governance-flagger:${{ github.sha }}`
            **Severity:** HIGH, CRITICAL

            ${{ steps.trivy.outcome == 'failure' && '❌ **Vulnerabilities found:**' || '✅ **No vulnerabilities found**' }}

            <details>
            <summary>View scan results</summary>

            ```
            ${{ steps.results.outputs.results }}
            ```

            </details>

      - name: Fail if vulnerabilities found
        if: steps.trivy.outcome == 'failure'
        run: exit 1

  security-scan-listener:
    name: Security Scan (Listener)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Listener image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile.listener
          push: false
          load: true
          tags: governance-listener:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 #v0.35.0 
        with:
          image-ref: governance-listener:${{ github.sha }}
