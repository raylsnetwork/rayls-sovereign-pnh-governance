      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 #v0.35.0 
        with:
          image-ref: governance-flagger:${{ github.sha }}
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '1'
