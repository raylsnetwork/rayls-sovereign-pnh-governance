          fi

      - name: Post Trivy results to PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: trivy-listener
          message: |
            ## 🔒 Security Scan - Listener

            **Image:** `governance-listener:${{ github.sha }}`
            **Severity:** HIGH, CRITICAL

            ${{ steps.trivy.outcome == 'failure' && '❌ **Vulnerabilities found:**' || '✅ **No vulnerabilities found**' }}

            <details>
