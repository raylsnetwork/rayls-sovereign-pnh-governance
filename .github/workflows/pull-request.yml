name: PR Checks

on:
  pull_request:
    branches:
      - main
      - 'version-*'
      - 'version/*'

env:
  GO_VERSION: '1.26.4'
  GOLANGCI_LINT_VERSION: 'v2.11.4'

jobs:
  # ===========================================================================
  # LINT - Formatters & Linters
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | \
            sh -s -- -b $(go env GOPATH)/bin ${{ env.GOLANGCI_LINT_VERSION }}
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run formatters
        run: golangci-lint fmt ./...

      - name: Check for formatting issues
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Formatting issues detected. Please run 'make lint' locally and commit/push the changes."
            echo ""
            echo "Files with formatting issues:"
            git status --porcelain
            echo ""
            echo "Diff:"
            git diff
            exit 1
          else
            echo "No formatting issues detected"
          fi

      - name: Run linters
        id: lint
        run: |
          golangci-lint run ./... 2>&1 | tee lint-output.txt || echo "lint_failed=true" >> $GITHUB_OUTPUT

      - name: Post lint results to PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: lint-results
          message: |
            ## 🔍 Lint Results

            ${{ steps.lint.outputs.lint_failed == 'true' && '❌ **Lint issues found:**' || '✅ **No lint issues found**' }}

            <details>
            <summary>View details</summary>

            ```
            ${{ steps.lint.outputs.lint_failed == 'true' && '$(cat lint-output.txt)' || 'All checks passed!' }}
            ```

            </details>

      - name: Fail if lint errors
        if: steps.lint.outputs.lint_failed == 'true'
        run: exit 1

  # ===========================================================================
  # SECURITY SCAN - Trivy vulnerability scanning
  # ===========================================================================
  security-scan-api:
    name: Security Scan (API)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          load: true
          tags: governance-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 #v0.35.0
        with:
          image-ref: governance-api:${{ github.sha }}
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln,misconfig'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      - name: Read Trivy results
        id: results
        if: always()
        run: |
          if [ -f trivy-results.txt ]; then
            echo "results<<EOF" >> $GITHUB_OUTPUT
            cat trivy-results.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "results=No scan results available" >> $GITHUB_OUTPUT
          fi

      - name: Post Trivy results to PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: trivy-api
          message: |
            ## 🔒 Security Scan - API

            **Image:** `governance-api:${{ github.sha }}`
            **Severity:** HIGH, CRITICAL

            ${{ steps.trivy.outcome == 'failure' && '❌ **Vulnerabilities found:**' || '✅ **No vulnerabilities found**' }}

            <details>
            <summary>View scan results</summary>

            ```
            ${{ steps.results.outputs.results }}
            ```

            </details>

      - name: Fail if vulnerabilities found
        if: steps.trivy.outcome == 'failure'
        run: exit 1

  security-scan-flagger:
